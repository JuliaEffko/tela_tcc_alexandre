
<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro | SportLife</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">

<style>
:root {
    --primary: #4f46e5;
    --bg-dark: #06060a;
    --card-bg: rgba(10,10,15,0.85);
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Plus Jakarta Sans', sans-serif;
}

body {
    background: var(--bg-dark);
    color: var(--text-main);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 30px 0;
}

.bg-glow-1, .bg-glow-2 {
    position: fixed;
    width: 500px;
    height: 500px;
    background: radial-gradient(circle,rgba(79,70,229,.18),transparent 70%);
    z-index: -1;
}

.bg-glow-1 { top: -10%; left: -10%; }
.bg-glow-2 { bottom: -20%; right: -10%; }

.card-container {
    width: 100%;
    max-width: 480px;
    padding: 20px;
}

.card {
    background: var(--card-bg);
    backdrop-filter: blur(24px);
    border: 1px solid rgba(255,255,255,.08);
    padding: 35px;
    border-radius: 24px;
    box-shadow: 0 30px 60px rgba(0,0,0,.6);
}

h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 3.5rem;
    background: linear-gradient(180deg,#fff,#818cf8,#4f46e5);
    background-clip: text;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-align: center;
}

.subtitle {
    text-align: center;
    color: var(--text-muted);
    font-size: .9rem;
    margin-bottom: 30px;
}

.input-group {
    margin-bottom: 18px;
}

label {
    display: block;
    font-size: .75rem;
    font-weight: 700;
    color: var(--text-muted);
    margin-bottom: 8px;
    text-transform: uppercase;
}

input {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,.1);
    background: rgba(255,255,255,.03);
    color: white;
    outline: none;
}

input:focus {
    border-color: var(--primary);
}

button {
    padding: 13px;
    border: none;
    border-radius: 10px;
    background: var(--primary);
    color: white;
    font-weight: 700;
    cursor: pointer;
    margin-top: 8px;
}

button:hover {
    filter: brightness(1.2);
}

.btn-principal {
    width: 100%;
    padding: 16px;
    text-transform: uppercase;
}

.btn-excluir {
    background: #dc2626;
}

.btn-editar {
    background: #4f46e5;
}

.note {
    text-align: center;
    margin-top: 25px;
    font-size: .85rem;
    color: var(--text-muted);
}

.note a {
    color: #818cf8;
    text-decoration: none;
}

.usuarios-container {
    margin-top: 35px;
}

.usuarios-container h2 {
    color: #818cf8;
    margin-bottom: 15px;
    font-size: 1.2rem;
}

.usuario-item {
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 12px;
    padding: 15px;
    margin-bottom: 12px;
    overflow-wrap: anywhere;
}

.usuario-item p {
    margin-bottom: 7px;
    font-size: .85rem;
    color: #cbd5e1;
}

.acoes {
    display: flex;
    gap: 10px;
}

.acoes button {
    flex: 1;
}

#mensagem {
    text-align: center;
    font-size: .85rem;
    margin-top: 12px;
    color: #818cf8;
}
</style>
</head>

<body>

<div class="bg-glow-1"></div>
<div class="bg-glow-2"></div>

<div class="card-container">
<div class="card">

<h1>Cadastre-se</h1>

<div class="subtitle">
Crie sua conta no SportLife para começar
</div>

<form id="registerForm">

<div class="input-group">
<label>Nome Completo</label>
<input type="text" id="fullname" placeholder="Digite seu nome completo" required>
</div>

<div class="input-group">
<label>Usuário</label>
<input type="text" id="username" placeholder="Escolha um usuário" required>
</div>

<div class="input-group">
<label>E-mail</label>
<input type="email" id="email" placeholder="seu@email.com" required>
</div>

<div class="input-group">
<label>Senha</label>
<input type="password" id="password" placeholder="Mínimo 6 caracteres" minlength="6" required>
</div>

<button type="submit" class="btn-principal">Criar Conta</button>

<p id="mensagem"></p>

</form>

<div class="note">
Já tem uma conta? <a href="login.html">Faça seu Login</a>
</div>

<div class="usuarios-container">

<h2>Usuários cadastrados</h2>

<div id="listaUsuarios">
Carregando usuários...
</div>

</div>

</div>
</div>

<script type="module">

// =====================================
// 1. IMPORTAÇÕES DO FIREBASE
// =====================================

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    updateDoc,
    deleteDoc,
    doc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
    getAuth,
    createUserWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


// =====================================
// 2. CONFIGURAÇÃO DO FIREBASE
// =====================================

const firebaseConfig = {
    apiKey: "SUA_API_KEY",
    authDomain: "SEU_AUTH_DOMAIN",
    projectId: "SEU_PROJECT_ID",
    storageBucket: "SEU_STORAGE_BUCKET",
    messagingSenderId: "SEU_MESSAGING_SENDER_ID",
    appId: "SEU_APP_ID"
};


// =====================================
// 3. INICIALIZAÇÃO
// =====================================

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const usuariosRef = collection(db, "usuarios");

const formulario = document.getElementById("registerForm");
const listaUsuarios = document.getElementById("listaUsuarios");
const mensagem = document.getElementById("mensagem");


// =====================================
// 4. CREATE - CADASTRAR USUÁRIO
// =====================================

formulario.addEventListener("submit", async (e) => {

    e.preventDefault();

    const nome = document.getElementById("fullname").value.trim();
    const usuario = document.getElementById("username").value.trim();
    const email = document.getElementById("email").value.trim();
    const senha = document.getElementById("password").value;

    try {

        mensagem.textContent = "Cadastrando...";

        const resultado = await createUserWithEmailAndPassword(
            auth,
            email,
            senha
        );

        await addDoc(usuariosRef, {
            uid: resultado.user.uid,
            nome: nome,
            usuario: usuario,
            email: email,
            dataCadastro: new Date().toISOString()
        });

        mensagem.textContent = "Conta criada com sucesso!";

        formulario.reset();

    } catch (erro) {

        mensagem.textContent = "Erro: " + erro.message;
        console.error(erro);

    }

});


// =====================================
// 5. READ - LISTAR USUÁRIOS
// =====================================

async function listarUsuarios() {

    try {

        const consulta = await getDocs(usuariosRef);

        listaUsuarios.innerHTML = "";

        if (consulta.empty) {
            listaUsuarios.textContent = "Nenhum usuário cadastrado.";
            return;
        }

        consulta.forEach((documento) => {

            const usuario = documento.data();

            const item = document.createElement("div");
            item.className = "usuario-item";

            const nome = document.createElement("p");
            nome.textContent = "Nome: " + usuario.nome;

            const username = document.createElement("p");
            username.textContent = "Usuário: " + usuario.usuario;

            const email = document.createElement("p");
            email.textContent = "E-mail: " + usuario.email;

            const acoes = document.createElement("div");
            acoes.className = "acoes";

            const editar = document.createElement("button");
            editar.textContent = "Editar";
            editar.className = "btn-editar";

            editar.addEventListener("click", () => {
                editarUsuario(documento.id, usuario);
            });

            const excluir = document.createElement("button");
            excluir.textContent = "Excluir";
            excluir.className = "btn-excluir";

            excluir.addEventListener("click", () => {
                excluirUsuario(documento.id);
            });

            acoes.appendChild(editar);
            acoes.appendChild(excluir);

            item.appendChild(nome);
            item.appendChild(username);
            item.appendChild(email);
            item.appendChild(acoes);

            listaUsuarios.appendChild(item);

        });

    } catch (erro) {

        listaUsuarios.textContent = "Erro ao carregar usuários.";
        console.error(erro);

    }

}


// =====================================
// 6. UPDATE - EDITAR USUÁRIO
// =====================================

async function editarUsuario(id, usuario) {

    const novoNome = prompt("Novo nome:", usuario.nome);

    if (novoNome === null) return;

    const novoUsuario = prompt("Novo usuário:", usuario.usuario);

    if (novoUsuario === null) return;

    const novoEmail = prompt("Novo e-mail:", usuario.email);

    if (novoEmail === null) return;

    if (!novoNome.trim() || !novoUsuario.trim() || !novoEmail.trim()) {
        alert("Preencha todos os campos!");
        return;
    }

    try {

        const referencia = doc(db, "usuarios", id);

        await updateDoc(referencia, {
            nome: novoNome.trim(),
            usuario: novoUsuario.trim(),
            email: novoEmail.trim()
        });

        alert("Usuário atualizado com sucesso!");

        listarUsuarios();

    } catch (erro) {

        alert("Erro ao editar: " + erro.message);
        console.error(erro);

    }

}


// =====================================
// 7. DELETE - EXCLUIR USUÁRIO
// =====================================

async function excluirUsuario(id) {

    const confirmar = confirm(
        "Deseja realmente excluir este usuário?"
    );

    if (!confirmar) return;

    try {

        await deleteDoc(doc(db, "usuarios", id));

        alert("Usuário excluído com sucesso!");

        listarUsuarios();

    } catch (erro) {

        alert("Erro ao excluir: " + erro.message);
        console.error(erro);

    }

}


// =====================================
// 8. CARREGAR USUÁRIOS
// =====================================

listarUsuarios();

</script>

</body>
</html>
